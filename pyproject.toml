[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "engine", "meta", "ui", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["core", "engine", "meta", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=core --cov=engine --cov=meta --cov=ui --cov-report=term-missing"

[tool.coverage.run]
source = ["core", "engine", "meta", "ui"]
omit = [
    "*/__pycache__/*",
    "*/templates/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
